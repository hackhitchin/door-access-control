name: Tests

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download ETL
        run: |
          git clone --depth 1 https://github.com/ETLCPP/etl.git third_party/etl

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Build tests with coverage
        run: |
          mkdir -p build

          gcc \
            --coverage \
            -c third_party/unity/unity.c \
            -Ithird_party/unity \
            -o build/unity.o

          echo "Building FSM tests..."
          g++ \
            -std=c++17 \
            -Wall -Wextra \
            --coverage \
            src/door_fsm.cpp \
            test/test_all.cpp \
            build/unity.o \
            -Isrc \
            -Ithird_party/unity \
            -Ithird_party/etl/include \
            -o build/test_fsm

          echo "Building controller tests..."
          g++ \
            -std=c++17 \
            -Wall -Wextra \
            --coverage \
            src/door_fsm.cpp \
            src/door_controller.cpp \
            test/test_controller.cpp \
            build/unity.o \
            -Isrc \
            -Ithird_party/unity \
            -Ithird_party/etl/include \
            -o build/test_controller

      - name: Run FSM tests
        run: |
          ./build/test_fsm

      - name: Run controller tests
        run: |
          ./build/test_controller

      - name: Generate coverage report
        run: |
          lcov \
            --capture \
            --branch-coverage \
            --directory . \
            --output-file build/coverage.info \
            --ignore-errors mismatch

          lcov \
            --remove build/coverage.info \
            'third_party/*' \
            'test/*' \
            --branch-coverage \
            --output-file build/coverage_filtered.info

          echo "===== COVERAGE SUMMARY ====="
          lcov \
            --summary build/coverage_filtered.info \
            --branch-coverage

      - name: Show missing coverage
        run: |
          echo "===== UNCOVERED LINES ====="
          awk '
            /^SF:/ {
              file = substr($0, 4)
            }
            /^DA:/ {
              split(substr($0, 4), a, ",")
              if (a[2] == 0) {
                print file ":" a[1]
              }
            }
          ' build/coverage_filtered.info

          echo ""
          echo "===== UNCOVERED FUNCTIONS ====="
          awk '
            /^SF:/ {
              file = substr($0, 4)
            }
            /^FN:/ {
              split(substr($0, 4), a, ",")
              fnline[a[2]] = a[1]
            }
            /^FNDA:/ {
              split(substr($0, 6), a, ",")
              if (a[1] == 0) {
                print file ":" fnline[a[2]] "  " a[2]
              }
            }
          ' build/coverage_filtered.info

          echo ""
          echo "===== UNCOVERED BRANCHES ====="
          awk '
            /^SF:/ {
              file = substr($0, 4)
            }
            /^BRDA:/ {
              split(substr($0, 6), a, ",")
              if (a[4] == "0" || a[4] == "-") {
                print file ":" a[1] \
                      "  block=" a[2] \
                      " branch=" a[3] \
                      " taken=" a[4]
              }
            }
          ' build/coverage_filtered.info

      - name: Enforce coverage
        run: |
          line_coverage=$(lcov \
            --summary build/coverage_filtered.info \
            --branch-coverage \
            | grep "lines" \
            | sed -E 's/.*: ([0-9.]+)%.*/\1/')

          function_coverage=$(lcov \
            --summary build/coverage_filtered.info \
            --branch-coverage \
            | grep "functions" \
            | sed -E 's/.*: ([0-9.]+)%.*/\1/')

          branch_coverage=$(lcov \
            --summary build/coverage_filtered.info \
            --branch-coverage \
            | grep "branches" \
            | sed -E 's/.*: ([0-9.]+)%.*/\1/')

          echo "Line coverage: $line_coverage%"
          echo "Function coverage: $function_coverage%"
          echo "Branch coverage: $branch_coverage%"

          awk "BEGIN { exit !($line_coverage >= 100.0) }" || {
            echo "Line coverage is below 100%"
            exit 1
          }

          awk "BEGIN { exit !($function_coverage >= 100.0) }" || {
            echo "Function coverage is below 100%"
            exit 1
          }

          # Some compiler-generated short-circuit branches represent
          # unreachable physical/state combinations, so literal 100% branch
          # coverage is not a useful requirement.
          awk "BEGIN { exit !($branch_coverage >= 88.0) }" || {
            echo "Branch coverage is below 88%"
            exit 1
          }