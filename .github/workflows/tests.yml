name: Tests

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download ETL
        run: |
          git clone --depth 1 https://github.com/ETLCPP/etl.git third_party/etl

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Build tests with coverage
        run: |
          mkdir -p build

          gcc \
            --coverage \
            -c third_party/unity/unity.c \
            -Ithird_party/unity \
            -o build/unity.o

          g++ \
            -std=c++17 \
            -Wall -Wextra \
            --coverage \
            src/door_fsm.cpp \
            test/test_all.cpp \
            build/unity.o \
            -Isrc \
            -Ithird_party/unity \
            -Ithird_party/etl/include \
            -o build/test_all

      - name: Run tests
        run: |
          ./build/test_all

      - name: Generate coverage report
        run: |
          lcov \
            --capture \
            --branch-coverage \
            --directory . \
            --output-file build/coverage.info \
            --ignore-errors mismatch

          lcov \
            --remove build/coverage.info \
            'third_party/*' \
            'test/*' \
            --branch-coverage \
            --output-file build/coverage_filtered.info

          lcov \
            --list build/coverage_filtered.info \
            --branch-coverage

      - name: Enforce coverage
        run: |
          line_coverage=$(lcov \
            --summary build/coverage_filtered.info \
            --branch-coverage \
            | grep "lines" \
            | sed -E 's/.*: ([0-9.]+)%.*/\1/')

          branch_coverage=$(lcov \
            --summary build/coverage_filtered.info \
            --branch-coverage \
            | grep "branches" \
            | sed -E 's/.*: ([0-9.]+)%.*/\1/')

          echo "Line coverage: $line_coverage%"
          echo "Branch coverage: $branch_coverage%"

          awk "BEGIN { exit !($line_coverage >= 100.0) }" || {
            echo "Line coverage is below 100%"
            exit 1
          }

          awk "BEGIN { exit !($branch_coverage >= 100.0) }" || {
            echo "Branch coverage is below 100%"
            exit 1
          }